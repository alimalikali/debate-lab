services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: debate_lab
      POSTGRES_USER: debate_lab
      POSTGRES_PASSWORD: debate_lab_local_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate_lab -d debate_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  postgres_data:
  ollama_data:
